<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 My eLibrary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/" class="brand">
      <span class="brand-icon">📖</span>
      <span class="brand-text">My eLibrary</span>
    </a>
    <div class="nav-links">
      <a href="https://myatmoe.info" class="nav-link">← Home</a>
    </div>
  </div>
</nav>

<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title">A Personal Library<br>of Curated Reads</h1>
    <p class="hero-subtitle">မြန်မာဘာသာပြန် နှင့် ဂန္ထဝင် စာအုပ်များ စုစည်းရာ နေရာ</p>
    <div class="hero-stats">
      <div class="stat">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-label">Books</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-num" id="statGenres">0</span>
        <span class="stat-label">Categories</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-num">3</span>
        <span class="stat-label">Formats</span>
      </div>
    </div>
  </div>
  <div class="hero-decoration">
    <div class="floating-book book-1">📕</div>
    <div class="floating-book book-2">📗</div>
    <div class="floating-book book-3">📘</div>
    <div class="floating-book book-4">📙</div>
  </div>
</section>

<section class="search-section">
  <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="စာအုပ်အမည် သို့မဟုတ် စာရေးသူ ရှာရန်...">
  </div>
  <div class="filters" id="filterBtns">
    <button class="filter-btn active" data-filter="all">📚 အားလုံး</button>
    <button class="filter-btn" data-filter="ဘာသာပြန်">🌐 ဘာသာပြန်</button>
    <button class="filter-btn" data-filter="မြန်မာ">🇲🇲 မြန်မာ</button>
    <button class="filter-btn" data-filter="ဂန္ထဝင်">⭐ ဂန္ထဝင်</button>
    <button class="filter-btn" data-filter="ရော်မန်တစ်">💕 ရော်မန်တစ်</button>
  </div>
</section>

<section class="library">
  <div class="library-header">
    <h2 class="section-title">The Collection</h2>
    <span class="result-count" id="resultCount"></span>
  </div>
  <div class="grid" id="bookGrid">
    <p class="loading-msg">📚 Loading library...</p>
  </div>
</section>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalIfOutside(event)">
  <div class="modal modal-detail">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="modal-overlay" id="reviewModal" onclick="closeReviewIfOutside(event)">
  <div class="modal modal-fullscreen">
    <div class="modal-header">
      <span class="modal-title" id="reviewTitle">Review</span>
      <button class="modal-close-inline" onclick="closeReview()">✕</button>
    </div>
    <iframe id="reviewFrame" src="" frameborder="0"></iframe>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <p>© 2026 Myat Moe Thwin · <a href="https://myatmoe.info">myatmoe.info</a></p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
