<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Playfair+Display:wght@400;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #1a1410;
      --bg-secondary: #241b14;
      --accent-gold: #c9a961;
      --accent-cream: #f4e9d8;
      --text-secondary: #c4b59a;
      --paper: #f4e9d8;
      --paper-dark: #1a1410;
      --border: #3d2f1f;
    }
    
    body {
      font-family: 'Padauk', sans-serif;
      background: var(--bg-primary);
      color: var(--accent-cream);
      height: 100vh;
      overflow: hidden;
    }
    
    .reader-header {
      background: var(--bg-secondary);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      height: 60px;
    }
    .back-btn {
      background: var(--accent-gold);
      color: var(--bg-primary);
      padding: 8px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9em;
      font-weight: 600;
      transition: all 0.2s;
    }
    .back-btn:hover { background: #e4c581; }
    
    .book-title-bar {
      color: var(--accent-cream);
      font-family: 'Playfair Display', serif;
      font-size: 1em;
      font-weight: 700;
      flex: 1;
      text-align: center;
      padding: 0 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .controls { display: flex; gap: 8px; }
    .ctrl-btn {
      background: var(--bg-primary);
      color: var(--accent-cream);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9em;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }
    
    #viewer {
      width: 100%;
      height: calc(100vh - 60px);
      background: var(--paper);
      transition: background 0.3s;
    }
    
    body.dark-reader #viewer { background: var(--paper-dark); }
    
    .nav-arrows {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(201, 169, 97, 0.9);
      color: var(--bg-primary);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.5em;
      user-select: none;
      z-index: 50;
      border: none;
      font-weight: 700;
      transition: all 0.2s;
    }
    .nav-arrows:hover {
      background: var(--accent-gold);
      transform: translateY(-50%) scale(1.1);
    }
    .prev-btn { left: 15px; }
    .next-btn { right: 15px; }
    
    .loading, .error-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 60px);
      color: var(--bg-primary);
      padding: 40px;
      text-align: center;
      font-family: 'Lora', serif;
    }
    .error-msg { color: #8b3a3a; }
    .error-msg a {
      color: var(--accent-gold);
      margin-top: 20px;
    }
    
    @media (max-width: 600px) {
      .nav-arrows { width: 40px; height: 40px; font-size: 1.2em; }
      .ctrl-btn { padding: 6px 10px; font-size: 0.85em; }
      .book-title-bar { font-size: 0.85em; }
    }
  </style>
</head>
<body>

<div class="reader-header">
  <a href="index.html" class="back-btn">← Library</a>
  <span class="book-title-bar" id="bookTitle">Loading...</span>
  <div class="controls">
    <button class="ctrl-btn" onclick="changeFontSize(-10)" title="Decrease font">A−</button>
    <button class="ctrl-btn" onclick="changeFontSize(10)" title="Increase font">A+</button>
    <button class="ctrl-btn" onclick="toggleTheme()" title="Toggle theme">🌓</button>
  </div>
</div>

<div id="viewer"><div class="loading">📖 Loading book...</div></div>

<button class="nav-arrows prev-btn" onclick="prevPage()" title="Previous">‹</button>
<button class="nav-arrows next-btn" onclick="nextPage()" title="Next">›</button>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script>
  let book, rendition;
  let currentFontSize = 100;
  let isDarkTheme = false;

  async function loadBook() {
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get('id');
    
    if (!bookId) {
      showError('No book specified');
      return;
    }
    
    try {
      const res = await fetch('books.json?v=' + Date.now());
      const books = await res.json();
      const bookData = books.find(b => b.id === bookId);
      
      if (!bookData) {
        showError('Book not found in library');
        return;
      }
      
      document.getElementById('bookTitle').textContent = bookData.title;
      document.title = '📖 ' + bookData.title;
      
      if (!bookData.downloads.epub) {
        showError('EPUB version not available for this book');
        return;
      }
      
      const epubUrl = convertDriveUrl(bookData.downloads.epub);
      
      book = ePub(epubUrl);
      rendition = book.renderTo('viewer', {
        width: '100%',
        height: '100%',
        flow: 'paginated',
        spread: 'auto'
      });
      
      rendition.themes.register('light', {
        body: {
          background: '#f4e9d8 !important',
          color: '#1a1410 !important',
          'font-family': "'Lora', 'Padauk', serif !important"
        }
      });
      rendition.themes.register('dark', {
        body: {
          background: '#1a1410 !important',
          color: '#f4e9d8 !important',
          'font-family': "'Lora', 'Padauk', serif !important"
        }
      });
      
      rendition.themes.fontSize(currentFontSize + '%');
      rendition.themes.select('light');
      
      await rendition.display();
      
      rendition.on('relocated', (location) => {
        localStorage.setItem('book-' + bookId, location.start.cfi);
      });
      
      const savedCfi = localStorage.getItem('book-' + bookId);
      if (savedCfi) {
        rendition.display(savedCfi);
      }
      
    } catch (err) {
      showError('Failed to load book.<br><br><small>' + err.message + '</small>');
    }
  }
  
  function convertDriveUrl(url) {
    if (!url.startsWith('http')) return url;
    if (url.includes('uc?export=download')) return url;
    const match = url.match(/[-\w]{25,}/);
    if (match) {
      return `https://drive.google.com/uc?export=download&id=${match[0]}`;
    }
    return url;
  }
  
  function showError(msg) {
    document.getElementById('viewer').innerHTML = 
      `<div class="error-msg">⚠️ ${msg}<br><a href="index.html">← Back to Library</a></div>`;
  }
  
  function nextPage() { if (rendition) rendition.next(); }
  function prevPage() { if (rendition) rendition.prev(); }
  
  function changeFontSize(delta) {
    currentFontSize = Math.max(60, Math.min(200, currentFontSize + delta));
    if (rendition) rendition.themes.fontSize(currentFontSize + '%');
  }
  
  function toggleTheme() {
    isDarkTheme = !isDarkTheme;
    document.body.classList.toggle('dark-reader', isDarkTheme);
    if (rendition) rendition.themes.select(isDarkTheme ? 'dark' : 'light');
  }
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') prevPage();
    if (e.key === 'ArrowRight') nextPage();
  });
  
  loadBook();
</script>

</body>
</html>
