<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 EPUB Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Padauk', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; overflow: hidden; }
    
    .reader-header {
      background: #0f0f1a; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #2a2a3e; height: 55px;
    }
    .back-btn {
      background: #7b68ee; color: #fff; padding: 8px 16px;
      border-radius: 6px; text-decoration: none; font-size: 0.9em;
    }
    .back-btn:hover { background: #6a57dd; }
    .book-title-bar { color: #b8a9ff; font-size: 1em; font-weight: 700; flex: 1; text-align: center; padding: 0 20px; }
    
    .controls { display: flex; gap: 8px; }
    .ctrl-btn {
      background: #2a2a3e; color: #fff; border: none;
      padding: 8px 12px; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 0.9em;
    }
    .ctrl-btn:hover { background: #3a3a4e; }
    
    #viewer {
      width: 100%; height: calc(100vh - 55px);
      background: #f5f5f0;
    }
    
    .nav-arrows {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: rgba(123, 104, 238, 0.9); color: #fff;
      width: 50px; height: 50px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.5em; user-select: none;
      z-index: 50; border: none;
    }
    .nav-arrows:hover { background: #7b68ee; }
    .prev-btn { left: 10px; }
    .next-btn { right: 10px; }
    
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: calc(100vh - 55px); color: #888;
    }
    
    .error-msg {
      padding: 40px; text-align: center; color: #de6f6f;
      max-width: 600px; margin: 0 auto;
    }
    .error-msg a { color: #7b68ee; }
  </style>
</head>
<body>

<div class="reader-header">
  <a href="index.html" class="back-btn">← Back</a>
  <span class="book-title-bar" id="bookTitle">Loading...</span>
  <div class="controls">
    <button class="ctrl-btn" onclick="changeFontSize(-10)">A−</button>
    <button class="ctrl-btn" onclick="changeFontSize(10)">A+</button>
    <button class="ctrl-btn" onclick="toggleTheme()">🌓</button>
  </div>
</div>

<div id="viewer"><div class="loading">📖 Loading book...</div></div>

<button class="nav-arrows prev-btn" onclick="prevPage()">‹</button>
<button class="nav-arrows next-btn" onclick="nextPage()">›</button>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script>
  let book, rendition;
  let currentFontSize = 100;
  let isDarkTheme = false;

  async function loadBook() {
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get('id');
    
    if (!bookId) {
      showError('No book ID provided');
      return;
    }
    
    try {
      const res = await fetch('books.json?v=' + Date.now());
      const books = await res.json();
      const bookData = books.find(b => b.id === bookId);
      
      if (!bookData) {
        showError('Book not found');
        return;
      }
      
      document.getElementById('bookTitle').textContent = bookData.title;
      document.title = '📖 ' + bookData.title;
      
      if (!bookData.downloads.epub) {
        showError('EPUB version not available for this book');
        return;
      }
      
      // Convert Google Drive URL to direct download
      const epubUrl = convertDriveUrl(bookData.downloads.epub);
      
      book = ePub(epubUrl);
      rendition = book.renderTo('viewer', {
        width: '100%',
        height: '100%',
        flow: 'paginated',
        spread: 'auto'
      });
      
      rendition.themes.fontSize(currentFontSize + '%');
      rendition.themes.register('dark', {
        body: { background: '#1a1a2e !important', color: '#e0e0e0 !important' }
      });
      rendition.themes.register('light', {
        body: { background: '#f5f5f0 !important', color: '#1a1a2e !important' }
      });
      rendition.themes.select('light');
      
      await rendition.display();
      
      // Save reading position
      rendition.on('relocated', (location) => {
        localStorage.setItem('book-' + bookId, location.start.cfi);
      });
      
      // Restore position
      const savedCfi = localStorage.getItem('book-' + bookId);
      if (savedCfi) {
        rendition.display(savedCfi);
      }
      
    } catch (err) {
      showError('Failed to load book: ' + err.message + 
        '<br><br>Note: Google Drive files >100MB ဖြစ်ရင် CORS error ဖြစ်နိုင်ပါတယ်။' +
        '<br>Download button နဲ့ စက်ထဲ download လုပ်ပြီး ဖတ်နိုင်ပါတယ်။');
    }
  }
  
  function convertDriveUrl(url) {
    // Extract FILE_ID from various Google Drive URL formats
    const match = url.match(/[-\w]{25,}/);
    if (match) {
      return `https://drive.google.com/uc?export=download&id=${match[0]}`;
    }
    return url;
  }
  
  function showError(msg) {
    document.getElementById('viewer').innerHTML = 
      `<div class="error-msg">⚠️ ${msg}<br><br><a href="index.html">← Back to Library</a></div>`;
  }
  
  function nextPage() { if (rendition) rendition.next(); }
  function prevPage() { if (rendition) rendition.prev(); }
  
  function changeFontSize(delta) {
    currentFontSize += delta;
    if (currentFontSize < 60) currentFontSize = 60;
    if (currentFontSize > 200) currentFontSize = 200;
    if (rendition) rendition.themes.fontSize(currentFontSize + '%');
  }
  
  function toggleTheme() {
    isDarkTheme = !isDarkTheme;
    if (rendition) rendition.themes.select(isDarkTheme ? 'dark' : 'light');
    document.body.style.background = isDarkTheme ? '#0f0f1a' : '#1a1a2e';
  }
  
  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') prevPage();
    if (e.key === 'ArrowRight') nextPage();
  });
  
  loadBook();
</script>

</body>
</html>
